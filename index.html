/* Login field contrast fix: keep inputs readable in light and dark browser themes. */
.loginbox input,
.loginbox input:focus,
.loginbox input:active {
  background: #ffffff !important;
  background-color: #ffffff !important;
  color: #24334b !important;
  -webkit-text-fill-color: #24334b !important;
  color-scheme: light;
  border: 1px solid #cbd5e1 !important;
  box-shadow: none;
}
.loginbox input::placeholder {
  color: #64748b !important;
  opacity: 1 !important;
  -webkit-text-fill-color: #64748b !important;
}
.loginbox input:focus {
  border-color: #315fe8 !important;
  box-shadow: 0 0 0 3px #315fe81a !important;
}
.loginbox input:-webkit-autofill,
.loginbox input:-webkit-autofill:hover,
.loginbox input:-webkit-autofill:focus {
  -webkit-text-fill-color: #24334b !important;
  box-shadow: 0 0 0 1000px #ffffff inset !important;
  transition: background-color 99999s ease-out 0s;
}
.loginbox label {
  color: #334155 !important;
}

.scheduler-result{margin:0 0 14px;border-color:#dce6fb;background:linear-gradient(180deg,#fff 0%,#fbfcff 100%)}
.scheduler-head{display:flex;justify-content:space-between;align-items:flex-start;gap:14px}
.scheduler-head h2{font-size:18px;margin:0;color:#22334f}
.scheduler-head .desc{font-size:11px;margin-top:6px}
.scheduler-status{font-size:9px;font-weight:850;letter-spacing:.6px;padding:7px 10px;border-radius:20px;white-space:nowrap}
.scheduler-status.good{background:#eaf8f1;color:#25875b}
.scheduler-status.warn{background:#fff5e8;color:#aa722d}
.scheduler-metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin:19px 0 14px}
.scheduler-metrics>div{border:1px solid #e9edf5;background:#fff;border-radius:9px;padding:12px}
.scheduler-metrics strong,.scheduler-metrics span{display:block}
.scheduler-metrics strong{font-size:24px;letter-spacing:-.6px;color:#263753}
.scheduler-metrics span{font-size:10px;color:#8794a8;margin-top:4px}
.scheduler-note{background:#f1f5ff;border:1px solid #e0e9ff;padding:11px 13px;border-radius:8px;color:#6b7d9d;font-size:11px;line-height:1.55}
.scheduler-note b{color:#3e5788}
.scheduler-note.warning{background:#fff8eb;border-color:#f4e5c6;color:#96723a;margin-top:10px}
.complete-message{margin-top:12px;background:#eff9f3;color:#287c57;padding:12px 14px;border-radius:8px;font-size:11px;font-weight:700}
.unscheduled-wrap{margin-top:14px}
.unscheduled-wrap h3{font-size:12px;margin:0 0 8px;color:#4a5a73}
.unscheduled-list{border:1px solid #f0e6d5;border-radius:8px;overflow:hidden;background:#fff}
.unscheduled-row{display:flex;justify-content:space-between;gap:15px;padding:10px 12px;border-bottom:1px solid #f3eee5;align-items:center}
.unscheduled-row:last-child{border:0}
.unscheduled-row b,.unscheduled-row span{display:block}
.unscheduled-row b{font-size:11px;color:#4c5a70}
.unscheduled-row span{font-size:9px;color:#9aa5b5;margin-top:3px}
.unscheduled-row small{font-size:10px;color:#a36f37;text-align:right;max-width:55%;line-height:1.4}
.scheduler-actions{display:flex;justify-content:flex-end;gap:9px;margin-top:15px}
@media(max-width:650px){.scheduler-metrics{grid-template-columns:repeat(2,minmax(0,1fr))}.scheduler-head{flex-direction:column}.unscheduled-row{align-items:flex-start;flex-direction:column;gap:6px}.unscheduled-row small{text-align:left;max-width:100%}.scheduler-actions{justify-content:stretch}.scheduler-actions .btn{flex:1}}


.availability-strip{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:11px 13px;margin:0 0 10px;background:#fff;border:1px solid #e8edf5;border-radius:9px}
.availability-strip>div:first-child{flex:1;min-width:220px}
.availability-strip b,.availability-strip span{display:block}
.availability-strip>div:first-child>b{font-size:11px;color:#52617a}
.availability-strip>div:first-child>span{font-size:10px;color:#94a0b0;margin-top:3px}
.availability-chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.availability-chips>span{display:inline-flex;align-items:center;gap:7px;background:#fff5e9;color:#986b32;border:1px solid #f2e4cd;border-radius:16px;padding:5px 8px;font-size:9px}
.availability-chips button{border:0;background:transparent;color:#a87939;font-size:14px;line-height:1;padding:0 2px}


.class-stack{display:flex;flex-direction:column;gap:4px;height:100%}

/* CampusFlow sidebar refresh — deep teal with a soft mint active state. */

  color: #edf8f6;

  color: #073b42;

<script data-campusflow-build="2.2.0">/* CampusFlow v2.2 GitHub-only demo — Supabase disconnected. No backend; browser-local demo storage. */


/* ===== 00 · one-time browser disconnect ===== */
(function () {
  try {
    localStorage.removeItem('campusflow-supabase-config');
    // Remove only Supabase Auth token cache keys; preserve CampusFlow demo data.
    const tokenKeys=[];
    for(let i=0;i<localStorage.length;i++){
      const key=localStorage.key(i);
      if(key && /^sb-.+-auth-token$/i.test(key)) tokenKeys.push(key);
    }
    tokenKeys.forEach(key=>localStorage.removeItem(key));
  } catch(error) {
    console.warn('CampusFlow could not clear the previous connection cache:', error);
  }
})();

/* ===== 01 · application configuration ===== */
(function (global) {
  'use strict';
  global.CampusFlowConfig = Object.freeze({
    appName: 'CampusFlow',
    version: '2.2.0-github-only',
    environment: 'github-pages-demo',
    storageKey: 'campusflow-demo',
    demoPassword: '123456',
    apiMode: 'local-demo',
    services: [
      { key: 'auth', name: 'Authentication', description: 'Demo login and role routing' },
      { key: 'users', name: 'User directory', description: 'Faculty and student-group profiles' },
      { key: 'courses', name: 'Course catalogue', description: 'Courses, groups and teaching allocations' },
      { key: 'timetable', name: 'Timetable', description: 'Draft and published class allocations' },
      { key: 'scheduler', name: 'Scheduling engine', description: 'Constraint checks and automatic generation' },
      { key: 'requests', name: 'Faculty requests', description: 'Availability and reschedule requests' },
      { key: 'notifications', name: 'Notifications', description: 'Role-targeted in-app alerts' },
      { key: 'email', name: 'Email notifications', description: 'Recipient-specific email previews; no sending yet' },
      { key: 'versions', name: 'Timetable versions', description: 'Snapshots, comparison, publishing and restore' },
      { key: 'weeks', name: 'Weekly timetable store', description: 'Independent schedules, drafts and published weeks' },
      { key: 'audit', name: 'Audit history', description: 'Recorded demo actions' }
    ]
  });
})(window);


/* ===== 02 · API request facade ===== */
(function (global) {
  'use strict';
  let adapter = null;
  const copy = value => value == null ? value : JSON.parse(JSON.stringify(value));
  const api = {
    setAdapter(nextAdapter) { adapter = nextAdapter; },
    get mode() { return adapter?.name || 'unconfigured'; },
    request(method, path, body) {
      if (!adapter || typeof adapter.request !== 'function') {
        throw new Error('CampusFlow API adapter is not configured.');
      }
      return adapter.request({ method: String(method || 'GET').toUpperCase(), path, body: copy(body) });
    },
    get(path, body) { return this.request('GET', path, body); },
    post(path, body) { return this.request('POST', path, body); },
    put(path, body) { return this.request('PUT', path, body); },
    patch(path, body) { return this.request('PATCH', path, body); },
    delete(path, body) { return this.request('DELETE', path, body); },
    clone: copy
  };
  global.CampusFlowAPI = api;
})(window);


/* ===== 03 · local browser demo adapter ===== */
(function (global) {
  'use strict';
  const cfg = global.CampusFlowConfig;
  const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
  const adapter = {
    name: 'Local browser demo adapter',
    request({ method, path, body }) {
      if (method === 'GET' && path === '/health') {
        return { ok: true, mode: 'local-demo', persistence: 'localStorage', backendConnected: false };
      }
      if (method === 'GET' && path === '/services/status') {
        return { mode: this.name, backendConnected: false, services: cfg.services.map(service => ({ ...service, status: 'Frontend module ready' })) };
      }
      if (method === 'GET' && path === '/state') {
        try {
          const raw = global.localStorage.getItem(cfg.storageKey);
          return raw ? JSON.parse(raw) : clone(body?.fallback ?? null);
        } catch (error) {
          console.warn('CampusFlow demo state could not be read:', error);
          return clone(body?.fallback ?? null);
        }
      }
      if (method === 'PUT' && path === '/state') {
        global.localStorage.setItem(cfg.storageKey, JSON.stringify(body?.state ?? null));
        return { ok: true, savedAt: new Date().toISOString() };
      }
      if (method === 'POST' && path === '/auth/session') {
        const id = String(body?.loginId ?? '').trim().toUpperCase();
        const password = String(body?.password ?? '');
        let role = '', normalizedId = '';
        if (id === 'ADMIN101') { role = 'Administrator'; normalizedId = 'Admin101'; }
        else if (id === 'CDNT101') { role = 'Coordinator'; normalizedId = 'CDNT101'; }
        else if ((body?.faculty || []).some(row => String(row[0]).trim().toUpperCase() === id)) { role = 'Faculty'; normalizedId = id; }
        else if ((body?.groups || []).some(row => String(row[0]).trim().toUpperCase() === id)) { role = 'Student Group'; normalizedId = id; }
        if (!id) return { ok: false, code: 'MISSING_ID', message: 'Please enter your login ID.' };
        if (!role) return { ok: false, code: 'UNKNOWN_ID', message: 'Login ID not found. Check your ID and try again.' };
        if (password !== cfg.demoPassword) return { ok: false, code: 'INVALID_PASSWORD', message: 'Incorrect password. Please try again.' };
        return { ok: true, role, id: normalizedId };
      }
      if (method === 'POST' && path === '/auth/signout') return { ok: true };
      throw new Error(`No local demo route for ${method} ${path}`);
    }
  };
  global.CampusFlowAPI.setAdapter(adapter);
  global.CampusFlowDemoAdapter = adapter;
})(window);


/* ===== 05 · storage service ===== */
(function (global) {
  'use strict';
  const api = global.CampusFlowAPI;
  global.CampusFlowServices = global.CampusFlowServices || {};
  global.CampusFlowServices.storage = {
    load(fallbackState) {
      const state = api.get('/state', { fallback: fallbackState });
      return state || api.clone(fallbackState);
    },
    save(state) { return api.put('/state', { state }); }
  };
})(window);


/* ===== 06 · authentication service ===== */
(function (global) {
  'use strict';
  global.CampusFlowServices = global.CampusFlowServices || {};
  global.CampusFlowServices.auth = {
    async signIn(loginId, password, directory) {
      return await global.CampusFlowAPI.post('/auth/session', {
        loginId, password,
        faculty: directory?.faculty || [],
        groups: directory?.groups || [],
        fallbackState: directory?.fallbackState || null
      });
    },
    async signOut() { return await global.CampusFlowAPI.post('/auth/signout', {}); }
  };
})(window);


/* ===== 07 · timetable service ===== */
(function (global) {
  'use strict';
  const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
  global.CampusFlowServices = global.CampusFlowServices || {};
  global.CampusFlowServices.timetable = {
    getDraftEntries(db) { return clone(db?.entries || []); },
    getPublishedEntries(db) { return clone(Array.isArray(db?.publishedEntries) ? db.publishedEntries : (db?.entries || [])); },
    findEntry(entries, entryId) { return (entries || []).find(entry => String(entry[0]) === String(entryId)) || null; },
    moveExistingEntry(entries, entryId, proposal) {
      let moved = false;
      const result = (entries || []).map(entry => {
        if (!moved && String(entry[0]) === String(entryId)) {
          moved = true;
          const next = clone(entry);
          next[6] = proposal.day; next[7] = proposal.start; next[8] = proposal.end; next[5] = proposal.room;
          return next;
        }
        return clone(entry);
      });
      return { entries: result, moved };
    }
  };
})(window);


/* ===== 08 · version history service ===== */
(function (global) {
  'use strict';
  const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
  global.CampusFlowServices = global.CampusFlowServices || {};
  global.CampusFlowServices.versions = {
    current(db) { return (db?.timetableVersions || []).find(v => v.id === db?.currentPublishedVersionId) || null; },
    newestFirst(db) { return (db?.timetableVersions || []).slice().sort((a,b) => (Number(b.versionNo)||0) - (Number(a.versionNo)||0)); },
    create(db, status, entries, options, actor) {
      db.timetableVersions = Array.isArray(db.timetableVersions) ? db.timetableVersions : [];
      const nextNo = db.timetableVersions.reduce((n,v) => Math.max(n, Number(v.versionNo)||0), 0) + 1;
      const record = {
        id: `TV-${String(nextNo).padStart(3,'0')}-${Date.now()}`,
        versionNo: nextNo, status, weekStart: db?.activeTimetableWeekStart || null, weekEnd: db?.activeTimetableWeekStart ? (() => { const d=new Date(`${db.activeTimetableWeekStart}T12:00:00`); d.setDate(d.getDate()+5); return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`; })() : null,
        title: options?.title || (status === 'Published' ? `Published version ${nextNo}` : `Draft snapshot ${nextNo}`),
        createdAt: new Date().toLocaleString('en-IN'),
        publishedAt: status === 'Published' ? new Date().toLocaleString('en-IN') : null,
        createdBy: actor || 'System', entries: clone(entries), notes: options?.notes || '',
        sourceVersionId: options?.sourceVersionId || null
      };
      db.timetableVersions.push(record);
      global.CampusFlowServices.audit?.record(db, status === 'Published' ? 'Published timetable' : 'Saved timetable snapshot', 'Timetable version', `v${nextNo} · ${record.title}`, actor || 'System');
      return record;
    },
    restoreEntries(version) { return clone(version?.entries || []); }
  };
})(window);


/* ===== 09 · weekly timetable service ===== */
(function (global) {
  'use strict';
  const clone = value => value == null ? value : JSON.parse(JSON.stringify(value));
  const isPublished = week => Boolean(week && (
    week.isPublished || week.currentPublishedVersionId ||
    (week.timetableVersions || []).some(v => v.status === 'Published' || v.status === 'Baseline')
  ));
  global.CampusFlowServices = global.CampusFlowServices || {};
  global.CampusFlowServices.weeks = {
    get(db, weekStart) {
      return (db?.timetableWeeks || []).find(week => week.weekStart === weekStart) || null;
    },
    list(db, options = {}) {
      const weeks = (db?.timetableWeeks || []).slice();
      const visible = options.publishedOnly ? weeks.filter(isPublished) : weeks;
      return visible.sort((a, b) => String(a.weekStart).localeCompare(String(b.weekStart)));
    },
    isPublished,
    create(db, record) {
      db.timetableWeeks = Array.isArray(db.timetableWeeks) ? db.timetableWeeks : [];
      const existing = this.get(db, record.weekStart);
      if (existing) return { created: false, record: existing };
      const safeRecord = clone(record);
      db.timetableWeeks.push(safeRecord);
      return { created: true, record: safeRecord };
    },

function entryVersionText(e){return `${e[6]} · ${label(e[7])}–${label(e[8])} · ${e[5]}`;}
function compareTimetableVersions(older,newer){
  const oldEntries=cloneEntries(older?.entries||[]),newEntries=cloneEntries(newer?.entries||[]);
  const pairs=[],oldUsed=new Set(),newUsed=new Set();
  const newById=new Map();
  newEntries.forEach((e,i)=>{if(e[0]!==undefined&&e[0]!==null)newById.set(String(e[0]),i);});
  // Stable allocation IDs give the most accurate comparison for manually edited classes.
  oldEntries.forEach((e,i)=>{
    if(e[0]===undefined||e[0]===null)return;
    const j=newById.get(String(e[0]));
    if(j!==undefined&&!newUsed.has(j)){pairs.push([i,j]);oldUsed.add(i);newUsed.add(j);}
  });
  // Auto-generated drafts use fresh IDs, so pair remaining sessions by course/group/faculty
  // and nearest previous slot to avoid reporting unchanged sessions as multiple moves.
  const baseKey=e=>[normId(e[2]),normId(e[4]),normId(e[3])].join('|');
  const oldGroups=new Map(),newGroups=new Map();
  oldEntries.forEach((e,i)=>{if(oldUsed.has(i))return;const k=baseKey(e);if(!oldGroups.has(k))oldGroups.set(k,[]);oldGroups.get(k).push({e,i});});
  newEntries.forEach((e,i)=>{if(newUsed.has(i))return;const k=baseKey(e);if(!newGroups.has(k))newGroups.set(k,[]);newGroups.get(k).push({e,i});});
  const groupKeys=new Set([...oldGroups.keys(),...newGroups.keys()]);
  const startMins=e=>timeMinutes(e[7]||'09:00');
  const distance=(a,b)=>Math.abs(days.indexOf(a[6])-days.indexOf(b[6]))*10000+Math.abs(startMins(a)-startMins(b))*10+(a[5]===b[5]?0:1);
  for(const key of groupKeys){
    const olds=(oldGroups.get(key)||[]).slice(),news=(newGroups.get(key)||[]).slice();
    while(olds.length&&news.length){
      let bestI=0,bestJ=0,bestCost=Infinity;
      for(let i=0;i<olds.length;i++)for(let j=0;j<news.length;j++){const cost=distance(olds[i].e,news[j].e);if(cost<bestCost){bestCost=cost;bestI=i;bestJ=j;}}
      const oldItem=olds.splice(bestI,1)[0],newItem=news.splice(bestJ,1)[0];
      pairs.push([oldItem.i,newItem.i]);oldUsed.add(oldItem.i);newUsed.add(newItem.i);
    }
  }
  const rows=[];let added=0,removed=0,changed=0,unchanged=0;
  const addRow=(a,b)=>{
    const e=b||a,title=`${e[1]} (${e[2]})`;
    if(!a){added++;rows.push({type:'Added',title,group:groupName(e[4]),before:'—',after:entryVersionText(b)});}
    else if(!b){removed++;rows.push({type:'Removed',title,group:groupName(e[4]),before:entryVersionText(a),after:'—'});}
    else if(a[5]!==b[5]||a[6]!==b[6]||a[7]!==b[7]||a[8]!==b[8]){changed++;rows.push({type:'Changed',title,group:groupName(e[4]),before:entryVersionText(a),after:entryVersionText(b)});}
    else unchanged++;
  };
  pairs.forEach(([i,j])=>addRow(oldEntries[i],newEntries[j]));
  oldEntries.forEach((e,i)=>{if(!oldUsed.has(i))addRow(e,null);});
  newEntries.forEach((e,i)=>{if(!newUsed.has(i))addRow(null,e);});
  return {rows,added,removed,changed,unchanged};
}

function timetableConflictList(){
  const conflicts=[];
  for(let i=0;i<db.entries.length;i++){
    for(let j=i+1;j<db.entries.length;j++){
      const a=db.entries[i],b=db.entries[j];
      if(a[6]!==b[6]||!intervalsOverlap(a[7],a[8],b[7],b[8]))continue;
      if(normId(a[3])===normId(b[3]))conflicts.push({type:'Faculty',day:a[6],first:a,second:b});
      if(normId(a[4])===normId(b[4]))conflicts.push({type:'Student group',day:a[6],first:a,second:b});
      if(normId(a[5])===normId(b[5]))conflicts.push({type:'Classroom',day:a[6],first:a,second:b});
    }
  }
  return conflicts;
}

function requestClassIdentityMatches(entry,request){
  return normId(entry?.[2])===normId(request.courseCode)&&
    normId(entry?.[3])===normId(request.facultyId)&&
    normId(entry?.[4])===normId(request.groupId);
}
function requestClassSlotMatches(entry,allocation){
  return Boolean(entry&&allocation&&entry[6]===allocation.day&&entry[7]===allocation.start&&entry[8]===allocation.end&&normId(entry[5])===normId(allocation.room));
}
function findOriginalRequestClass(entries,request){
  const rows=Array.isArray(entries)?entries:[];
  const byId=rows.findIndex(e=>String(e[0])===String(request.entryId)&&requestClassIdentityMatches(e,request));
  if(byId>=0&&requestClassSlotMatches(rows[byId],request.old))return byId;
  return rows.findIndex(e=>requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,request.old));
}
function findDraftRequestClass(entries,request,proposal){
  const rows=Array.isArray(entries)?entries:[];
  let idx=rows.findIndex(e=>String(e[0])===String(request.entryId)&&requestClassIdentityMatches(e,request));
  if(idx>=0)return idx;
  idx=rows.findIndex(e=>requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,request.old));
  if(idx>=0)return idx;
  // Recover a duplicate created by an older approval implementation: reuse the row already
  // sitting at the proposed slot instead of appending another copy.
  idx=rows.findIndex(e=>requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,proposal));
  if(idx>=0)return idx;
  // Auto-generated drafts may use new IDs. Match the nearest remaining session of this course,
  // group and faculty to the original published slot.
  const candidates=rows.map((e,i)=>({e,i})).filter(x=>requestClassIdentityMatches(x.e,request));
  if(!candidates.length)return -1;
  const oldDay=days.indexOf(request.old?.day),oldTime=timeMinutes(request.old?.start||'09:00');
  candidates.sort((a,b)=>{
    const score=x=>Math.abs(days.indexOf(x.e[6])-oldDay)*10000+Math.abs(timeMinutes(x.e[7])-oldTime)*10+(normId(x.e[5])===normId(request.old?.room)?0:1);
    return score(a)-score(b);
  });
  return candidates[0].i;
}
function applyRequestMoveToEntries(entries,request,proposal,sourceEntry){
  const rows=cloneEntries(entries);
  let keepIndex=findDraftRequestClass(rows,request,proposal);
  if(keepIndex<0){
    const inserted=cloneEntries([sourceEntry])[0];
    inserted[6]=proposal.day;inserted[7]=proposal.start;inserted[8]=proposal.end;inserted[5]=proposal.room;
    rows.push(inserted);
    keepIndex=rows.length-1;
  }
  const target=rows[keepIndex];
  // The original class is moved in place. Remove only exact copies of this same weekly session
  // at its old/proposed slot; other sessions of the same course remain untouched.
  const result=[];
  rows.forEach((entry,index)=>{
    if(index!==keepIndex&&requestClassIdentityMatches(entry,request)&&
      (requestClassSlotMatches(entry,request.old)||requestClassSlotMatches(entry,proposal)))return;
    if(index===keepIndex){
      target[6]=proposal.day;target[7]=proposal.start;target[8]=proposal.end;target[5]=proposal.room;
      result.push(target);
    }else result.push(entry);
  });
  return result;
}
function reviewFacultyRequest(id,decision){
  if(role!=='Coordinator'){notify('Only the Coordinator can review faculty requests.');return;}
  const request=CampusFlowServices.requests.find(db,id);
  if(!request||request.status!=='Pending'){notify('This request is no longer pending.');return;}
  const remarks=(document.getElementById(`review_${id}`)?.value||'').trim();
  if(decision==='reject'){
    if(!remarks){notify('Please add a brief reason before rejecting the request.');return;}
    CampusFlowServices.requests.recordDecision(db,request,'Rejected',remarks,loggedInId,new Date().toLocaleString('en-IN'));
    db.notices.unshift(['Faculty request rejected',`Your ${request.type==='availability'?'availability':request.type==='timetable_cancel'?'class cancellation':'timetable change'} request (${request.id}) was rejected. Coordinator remarks: ${remarks}`,'Just now',request.facultyId,false]);
    save();render();notify('Request rejected. The faculty member has been notified.');return;
  }
  if(decision!=='approve'){notify('Unknown review action.');return;}
  if(request.type==='availability'){
    const savedConflict=findSavedAvailabilityConflict(request.facultyId,request.day,request.start,request.end);
    if(savedConflict){const conflict=savedConflict.entry;notify(`Cannot approve yet: ${facultyName(request.facultyId)} already has ${conflict[1]} scheduled during that period in the saved week starting ${savedConflict.weekStart}. Resolve that class allocation first.`);return;}
    const exists=(db.facultyUnavailable||[]).some(x=>normId(x[0])===normId(request.facultyId)&&x[1]===request.day&&x[2]<=request.start&&x[3]>=request.end);
    if(!exists)db.facultyUnavailable.push([request.facultyId,request.day,request.start,request.end,request.reason]);
    CampusFlowServices.requests.recordDecision(db,request,'Approved',remarks||'Availability restriction approved and added to scheduler constraints.',loggedInId,new Date().toLocaleString('en-IN'));
    db.notices.unshift(['Availability request approved',`Your unavailable period for ${request.day}, ${availabilityPeriodLabel(request.start,request.end)} has been approved. The scheduler will avoid this time range in future timetable generation.`,'Just now',request.facultyId,false]);
    save();render();notify('Availability request approved. The scheduling restriction is active.');return;
  }
  if(request.type==='timetable_cancel'){
    if(generationResult){notify('Apply or discard the timetable-generation preview before approving a class cancellation.');return;}
    const requestWeek=request.weekStart||DEFAULT_TIMETABLE_WEEK;
    if(requestWeek!==activeWeekStart){if(!db.timetableWeeks.some(w=>w.weekStart===requestWeek)){notify(`Cannot approve: the timetable week ${requestWeek} no longer exists.`);return;}activateTimetableWeek(requestWeek,false);}
    const before=cloneEntries(getPublishedTimetableEntries());
    const index=findOriginalRequestClass(before,request);
    if(index<0){notify('Cannot approve: the original class no longer matches the published timetable. Ask the faculty member to submit a fresh request.');return;}
    const removed=cloneEntries([before[index]])[0];
    const after=before.filter((entry,i)=>i!==index);
    const draft=(db.entries||[]).filter(entry=>!(requestClassIdentityMatches(entry,request)&&(requestClassSlotMatches(entry,request.old)||String(entry[0])===String(request.entryId))));
    const timestamp=new Date().toLocaleString('en-IN');
    const previousVersion=currentPublishedVersion();
    const version=createTimetableVersion('Published',after,{title:`Approved cancellation · ${request.courseCode||removed[2]}`,notes:`Published automatically when the Coordinator approved cancellation request ${request.id}.`});
    db.entries=cloneEntries(draft);db.publishedEntries=cloneEntries(after);db.currentPublishedVersionId=version.id;
    versionCompareA=version.id;versionCompareB=previousVersion?.id||'';
    createEmailNotificationDrafts(before,after,version.versionNo,timestamp,[{type:'Removed',oldEntry:removed,newEntry:null,title:removed[1],code:removed[2]}]);
    const message=`${removed[1]} (${removed[2]}) on ${requestScheduleText(removed[6],removed[7],removed[8],removed[5])} has been cancelled. Published timetable v${version.versionNo} is now active.`;
    db.notices.unshift(['Class cancelled · timetable published',message,timestamp,request.facultyId,false]);
    db.notices.unshift(['Class cancelled · timetable published',message,timestamp,request.groupId,false]);
    CampusFlowServices.requests.recordDecision(db,request,'Approved',remarks||`Cancellation approved and published as timetable v${version.versionNo}.`,loggedInId,timestamp);
    request.appliedAt=timestamp;request.publishedVersionId=version.id;request.publishedVersionNo=version.versionNo;
    save();render();notify(`Class cancelled and published as v${version.versionNo}. Faculty and ${groupName(request.groupId)} have been updated.`);return;
  }
  if(request.type!=='timetable_change'){notify('This request type is not supported.');return;}
  if(generationResult){notify('Apply or discard the timetable-generation preview before approving a class move.');return;}
  const requestWeek=request.weekStart||DEFAULT_TIMETABLE_WEEK;
  if(requestWeek!==activeWeekStart){
    if(!db.timetableWeeks.some(w=>w.weekStart===requestWeek)){notify(`Cannot approve: the timetable week ${requestWeek} no longer exists.`);return;}
    activateTimetableWeek(requestWeek,false);
  }

  const proposal=request.proposed||{},old=request.old||{};
  if(!days.includes(proposal.day)||!proposal.start||!proposal.end||!proposal.room){notify('Cannot approve: the proposed day, time or room is incomplete.');return;}
  const publishedBefore=cloneEntries(getPublishedTimetableEntries());
  const publishedIndex=findOriginalRequestClass(publishedBefore,request);
  if(publishedIndex<0){notify('Cannot approve: the original class no longer matches the published timetable. Ask the faculty member to submit a fresh request.');return;}
  const publishedTarget=cloneEntries([publishedBefore[publishedIndex]])[0];
  // Detect a prior buggy approval's extra copy in the proposed slot and ignore/remove that exact
  // duplicate, but never ignore another course or another weekly session.
  const proposedDuplicates=publishedBefore.filter((e,i)=>i!==publishedIndex&&requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,proposal));
  const course=db.courses.find(c=>normId(c[0])===normId(publishedTarget[2]));
  const group=db.groups.find(g=>normId(g[0])===normId(publishedTarget[4]));
  const room=db.rooms.find(r=>normId(r[0])===normId(proposal.room));
  if(!course||!group||!room||!roomFitsCourse(room,course,group)){notify('Cannot approve: proposed room is missing, too small or unsuitable for this course.');return;}
  if(!durationBlocks(courseDuration(course)).some(b=>b.start===proposal.start&&b.end===proposal.end)){notify('Cannot approve: the proposed time does not match a valid continuous block for this class duration.');return;}
  if(isFacultyBlocked(request.facultyId,proposal.day,proposal.start,proposal.end)){notify('Cannot approve: the faculty member is marked unavailable during the proposed period.');return;}

  const conflicts=publishedBefore.filter((e,i)=>{
    if(i===publishedIndex)return false;
    if(requestClassIdentityMatches(e,request)&&(requestClassSlotMatches(e,old)||requestClassSlotMatches(e,proposal)))return false;
    return e[6]===proposal.day&&intervalsOverlap(proposal.start,proposal.end,e[7],e[8])&&
      (normId(e[3])===normId(publishedTarget[3])||normId(e[4])===normId(publishedTarget[4])||normId(e[5])===normId(proposal.room));
  });
  if(conflicts.length){
    const conflict=conflicts[0],reason=normId(conflict[3])===normId(publishedTarget[3])?'faculty member':normId(conflict[4])===normId(publishedTarget[4])?'student group':'room';
    notify(`Cannot approve: ${reason} conflict with ${conflict[1]} at the proposed time.`);return;
  }

  // Apply the reschedule to the existing allocation in both the working draft and published data.
  // No new class is created; a legacy copy at the destination is collapsed into the same record.
  const updatedTarget=cloneEntries([publishedTarget])[0];
  updatedTarget[6]=proposal.day;updatedTarget[7]=proposal.start;updatedTarget[8]=proposal.end;updatedTarget[5]=proposal.room;
  const nextPublished=[];
  publishedBefore.forEach((entry,index)=>{
    if(index===publishedIndex){nextPublished.push(updatedTarget);return;}
    if(requestClassIdentityMatches(entry,request)&&
      (requestClassSlotMatches(entry,old)||requestClassSlotMatches(entry,proposal)))return;
    nextPublished.push(entry);
  });
  const nextDraft=applyRequestMoveToEntries(db.entries,request,proposal,publishedTarget);

  const timestamp=new Date().toLocaleString('en-IN');
  const previousVersion=currentPublishedVersion();
  const version=createTimetableVersion('Published',nextPublished,{
    title:`Approved reschedule · ${request.courseCode||publishedTarget[2]}`,
    notes:`Published automatically when the Coordinator approved request ${request.id}. The existing class allocation was moved; no extra class was added.`
  });
  db.entries=nextDraft;
  db.publishedEntries=cloneEntries(nextPublished);
  db.currentPublishedVersionId=version.id;
  versionCompareA=version.id;versionCompareB=previousVersion?.id||'';

  const emailChange={type:'Changed',oldEntry:publishedTarget,newEntry:updatedTarget,title:publishedTarget[1],code:publishedTarget[2]};
  createEmailNotificationDrafts(publishedBefore,nextPublished,version.versionNo,timestamp,[emailChange]);
  const oldText=requestScheduleText(old.day,old.start,old.end,old.room);
  const newText=requestScheduleText(proposal.day,proposal.start,proposal.end,proposal.room);
  const message=`${publishedTarget[1]} (${publishedTarget[2]}) has been rescheduled. Previous: ${oldText}. New: ${newText}. Published timetable v${version.versionNo} is now active.`;
  db.notices.unshift(['Class rescheduled · timetable published',message,timestamp,request.facultyId,false]);
  db.notices.unshift(['Class rescheduled · timetable published',message,timestamp,request.groupId,false]);

  CampusFlowServices.requests.recordDecision(db,request,'Approved',remarks||`Approved and published as timetable v${version.versionNo}. The existing class was moved to the requested day, time and room.`,loggedInId,timestamp);
  request.appliedAt=timestamp;
  request.publishedVersionId=version.id;request.publishedVersionNo=version.versionNo;
  request.duplicateCopiesRemoved=proposedDuplicates.length;
  save();render();
  notify(`Class moved and published as v${version.versionNo}. Faculty and ${groupName(request.groupId)} have been updated; email previews are ready.`);
}

function allSavedWeekEntriesForChecks(){
  const result=[],seen=new Set();
  const add=(weekStart,source,rows)=>{
    (Array.isArray(rows)?rows:[]).forEach((entry,index)=>{
      if(!Array.isArray(entry))return;
      const key=[weekStart||'unknown',entry[0]??index,entry[2],entry[3],entry[4],entry[5],entry[6],entry[7],entry[8]].join('|');
      if(seen.has(key))return;seen.add(key);result.push({weekStart,source,entry});
    });
  };
  for(const week of (db.timetableWeeks||[])){
    add(week.weekStart,'draft',week.entries);
    add(week.weekStart,'published',week.publishedEntries);
    for(const version of (week.timetableVersions||[]))add(week.weekStart,`version:${version.status||'snapshot'}`,version.entries);
  }
  add(activeWeekStart,'active-draft',db.entries);
  add(activeWeekStart,'active-published',db.publishedEntries);
  for(const version of (db.timetableVersions||[]))add(activeWeekStart,`active-version:${version.status||'snapshot'}`,version.entries);
  return result;
}
function findSavedAvailabilityConflict(facultyId,day,start,end){
  return allSavedWeekEntriesForChecks().find(({entry})=>
    normId(entry[3])===normId(facultyId)&&entry[6]===day&&intervalsOverlap(start,end,entry[7],entry[8])
  )||null;
}
function validateClassAllocation(input){
  const {courseCode,facultyId,groupId,roomId,day,start,end,entries=db.entries,ignoreEntryId=null,checkWeeklyTarget=true}=input;
  const course=db.courses.find(c=>normId(c[0])===normId(courseCode));
  const faculty=db.faculty.find(f=>normId(f[0])===normId(facultyId));
  const group=db.groups.find(g=>normId(g[0])===normId(groupId));
  const room=db.rooms.find(r=>normId(r[0])===normId(roomId));
  if(!course||!faculty||!group||!room)return {valid:false,error:'Select a valid course, its assigned faculty member and student group, and a classroom.'};
  if(normId(course[4])!==normId(faculty[0]))return {valid:false,error:`${course[0]} is assigned to ${facultyName(course[4])}. Select the faculty member assigned to this course.`};
  if(normId(course[3])!==normId(group[0]))return {valid:false,error:`${course[0]} is assigned to ${groupName(course[3])}. Select the student group assigned to this course.`};
  if(normId(group[2])!==normId(course[2])||normId(faculty[2])!==normId(course[2]))return {valid:false,error:'The course, assigned faculty member and student group must belong to the same department.'};
  if(!days.includes(day))return {valid:false,error:'Choose a valid teaching day (Monday–Saturday).'};
  if(!durationBlocks(courseDuration(course)).some(block=>block.start===start&&block.end===end))return {valid:false,error:`${course[1]} requires a valid ${courseDuration(course)}-minute continuous teaching block. Check the selected start and end times.`};
  if(!roomFitsCourse(room,course,group))return {valid:false,error:`${room[1]} is not suitable for ${course[1]}. Check room type, required facilities and the group capacity of ${group[3]}.`};
  if(isFacultyBlocked(faculty[0],day,start,end))return {valid:false,error:`${facultyName(faculty[0])} is marked unavailable during this period.`};
  const rows=Array.isArray(entries)?entries:[];
  const sameCourse=rows.filter(e=>normId(e[2])===normId(course[0])&&String(e[0])!==String(ignoreEntryId));
  if(checkWeeklyTarget&&sameCourse.length>=Number(course[5]||0))return {valid:false,error:`${course[1]} already has its required ${course[5]} weekly session(s) allocated. Increase the course requirement before adding another.`};
  const clash=rows.find(e=>String(e[0])!==String(ignoreEntryId)&&e[6]===day&&intervalsOverlap(start,end,e[7],e[8])&&(
    normId(e[3])===normId(faculty[0])||normId(e[4])===normId(group[0])||normId(e[5])===normId(room[0])
  ));
  if(clash){
    if(normId(clash[3])===normId(faculty[0]))return {valid:false,error:`${facultyName(faculty[0])} is already assigned to ${clash[1]} at that time.`};
    if(normId(clash[4])===normId(group[0]))return {valid:false,error:`${group[1]} already has ${clash[1]} at that time.`};
    return {valid:false,error:`${room[1]} is already booked at that time.`};
  }
  return {valid:true,course,faculty,group,room};
}
function validateDraftForPublish(){
  const errors=[],counts=new Map(),seenIds=new Set();
  for(const entry of (db.entries||[])){
    const id=String(entry[0]);
    if(seenIds.has(id))errors.push(`Duplicate timetable allocation ID ${id}.`);else seenIds.add(id);
    const result=validateClassAllocation({courseCode:entry[2],facultyId:entry[3],groupId:entry[4],roomId:entry[5],day:entry[6],start:entry[7],end:entry[8],entries:db.entries,ignoreEntryId:entry[0],checkWeeklyTarget:false});
    if(!result.valid)errors.push(`${entry[2]||'Class'}: ${result.error}`);
    const key=normId(entry[2]);counts.set(key,(counts.get(key)||0)+1);
  }
  for(const course of (db.courses||[])){
    const actual=counts.get(normId(course[0]))||0;
    const required=Math.max(0,Number(course[5])||0);
    // Cancellation records reduce the number of sessions still expected (see
    // getPublicationWarnings), but they must NOT reduce the maximum allowed number
    // of currently scheduled classes. Otherwise a course with three valid active
    // sessions plus three historical cancellation records is incorrectly treated
    // as 3/0 and blocked from publication. Enforce the academic maximum against
    // the course's configured weekly requirement only.
    if(actual>required)errors.push(`${course[0]} has ${actual-required} extra weekly session(s) (${actual}/${required} allocated).`);
  }
  const overlaps=timetableConflictList();
  if(overlaps.length)errors.unshift(`${overlaps.length} faculty, group or classroom overlap(s) detected.`);
  return errors;
}

function cancelPartialPublish(){publicationConfirmWarnings=[];allowPartialPublishOnce=false;render();notify('Publication cancelled. Your timetable remains a draft.');}
function confirmPartialPublish(){if(publishInProgress)return;allowPartialPublishOnce=true;publicationConfirmWarnings=[];publish();}

function getPublicationWarnings(){
  const counts=new Map();(db.entries||[]).forEach(e=>counts.set(normId(e[2]),(counts.get(normId(e[2]))||0)+1));
  const warnings=[];
  for(const course of (db.courses||[])){
    const actual=counts.get(normId(course[0]))||0;
    const cancelled=(db.weekCancellations?.[activeWeekStart]||[]).filter(c=>normId(c.entry?.[2])===normId(course[0])).length;
    const target=Math.max(0,(Number(course[5])||0)-cancelled);
    if(actual<target)warnings.push(`${course[1]} (${course[0]}): ${actual}/${target} sessions allocated; ${target-actual} still unplaced.`);
  }
  return warnings;
}

async function publish(){
  if(publishInProgress)return;
  if(role!=='Coordinator'&&role!=='Administrator'){notify('Only the Coordinator or Administrator can publish the timetable.');return;}
  publishInProgress=true;
  let beforePublish=null;
  let publicationMutationStarted=false;
  const publishButtons=[...document.querySelectorAll('[data-cf-publish]')];
  publishButtons.forEach(button=>{button.disabled=true;button.textContent='Publishing…';});
  try{
    beforePublish=cloneData(db);
    if(generationResult){
      publishInProgress=false;
      notify('Apply or discard the scheduler preview before publishing a version.');
      return;
    }

    const validationErrors=validateDraftForPublish();
    if(validationErrors.length){
      publishIssues=validationErrors;
      publicationConfirmWarnings=[];
      publishInProgress=false;
      render();
      notify(`Publication blocked: ${validationErrors.length} issue(s). See the report above the timetable.`);
      return;
    }

    const publicationWarnings=getPublicationWarnings();
    if(publicationWarnings.length&&!allowPartialPublishOnce){
      publicationConfirmWarnings=publicationWarnings;
      publishInProgress=false;
      render();
      notify('Review the unallocated sessions and choose whether to keep the draft or publish the valid classes.');
      return;
    }
    allowPartialPublishOnce=false;
    publicationConfirmWarnings=[];

    if(!db.entries.length&&!(db.weekCancellations?.[activeWeekStart]||[]).length){
      publishIssues=['Add or generate at least one class before publishing this week.'];
      publishInProgress=false;
      render();
      notify(publishIssues[0]);
      return;
    }

    publicationMutationStarted=true;
    const previousPublished=currentPublishedVersion();
    const previousEntries=cloneEntries(db.publishedEntries||previousPublished?.entries||[]);
    const version=createTimetableVersion('Published',db.entries,{title:`Published ${formatWeekRange()}`,notes:`Published after timetable overlap validation for ${formatWeekRange()}.`});
    versionCompareA=version.id;versionCompareB=previousPublished?.id||'';
    db.publishedEntries=cloneEntries(db.entries);
    db.currentPublishedVersionId=version.id;
    const activeWeekRecord=(db.timetableWeeks||[]).find(w=>w.weekStart===activeWeekStart);
    if(activeWeekRecord)activeWeekRecord.isPublished=true;
    const timestamp=new Date().toLocaleString('en-IN');
    const emailDraftSummary=createEmailNotificationDrafts(previousEntries,db.publishedEntries,version.versionNo,timestamp);
    const message=`Timetable version v${version.versionNo} has been published. Please review your updated schedule.`;
    const cancelledThisWeek=db.weekCancellations?.[activeWeekStart]||[];
    const affectedEntries=[...previousEntries,...db.publishedEntries,...cancelledThisWeek.map(c=>c.entry).filter(Boolean)];
    const groupIds=[...new Set(affectedEntries.map(e=>e[4]).filter(Boolean))];
    const facultyIds=[...new Set(affectedEntries.map(e=>e[3]).filter(Boolean))];
    [...groupIds,...facultyIds].forEach(audience=>db.notices.unshift(['Timetable published',message,timestamp,audience,false]));
    cancelledThisWeek.forEach(c=>{
      const e=c.entry;if(!e)return;
      const cancellationMessage=`${e[1]} (${e[2]}) scheduled for ${e[6]} ${label(e[7])}–${label(e[8])} has been cancelled in published timetable v${version.versionNo}. Reason: ${c.reason}`;
      if(e[3])db.notices.unshift(['Class cancelled · timetable published',cancellationMessage,timestamp,e[3],false]);
      if(e[4])db.notices.unshift(['Class cancelled · timetable published',cancellationMessage,timestamp,e[4],false]);
    });

    // Persist the published week to this browser's local demo storage.
    save();

    publishIssues=[];
    page='Timetable Versions';
    render();
    notify(`Published ${formatWeekRange()} as v${version.versionNo}${publicationWarnings.length?` with ${publicationWarnings.length} course requirement warning(s)`:''}. ${emailDraftSummary.recipients} email previews created (${emailDraftSummary.ready} addresses ready, ${emailDraftSummary.missing} missing).`);
  }catch(error){
    // If local persistence fails, restore the in-memory and browser-saved draft snapshot.
    // Never leave the UI showing Published when the local save did not complete.
    if(publicationMutationStarted&&beforePublish){
      db=beforePublish;
      loadWeekIntoGlobals(activeWeekStart);
      try{localStorage.setItem(CampusFlowConfig.storageKey,JSON.stringify(db));}
      catch(storageError){console.warn('Could not restore local draft after publish failure:',storageError);}
    }
    const raw=error?.message||String(error);
    let friendly;
    if(/STATE_CONFLICT|revision/i.test(raw)){
      friendly='The browser data changed during publication. Your draft was kept. Refresh this page data, review the timetable, then publish again.';
    }else if(/permission|row-level|RLS|not allowed|42501/i.test(raw)){
      friendly=`The publication could not be completed: ${raw}. Your timetable remains a draft. Check the browser storage and try again.`;
    }else{
      friendly=`Publication could not be completed: ${raw}. Your timetable remains a draft. Refresh this browser and retry.`;
    }
    publishIssues=[friendly];
    publicationConfirmWarnings=[];
    page='Timetable';
    render();
    notify('The timetable was not published. Read the explanation shown above the timetable.');
  }finally{
    publishInProgress=false;
    document.querySelectorAll('[data-cf-publish]').forEach(button=>{button.disabled=false;button.textContent=button.dataset.defaultLabel||button.textContent;});
  }
}

function courseDuration(course){
  const stored=Number(course[8]);
  return stored>0?stored:(course[6]==='Practical'?120:60);
}
function timeMinutes(t){const p=t.split(':').map(Number);return p[0]*60+p[1]}
function durationBlocks(duration){
  const blocks=[];
  for(let i=0;i<slots.length;i++){
    let total=0,lastEnd=slots[i][0];
    for(let j=i;j<slots.length;j++){
      if(j>i&&slots[j-1][1]!==slots[j][0])break;
      total+=timeMinutes(slots[j][1])-timeMinutes(slots[j][0]);
      lastEnd=slots[j][1];
      if(total===duration){blocks.push({start:slots[i][0],end:lastEnd,startIndex:i});break}
      if(total>duration)break;
    }
  }
  return blocks;
}
function roomTypeFitsCourse(room,course){
  if(!room)return false;
  const required=course[7]||'Classroom';
  let typeOK=false;
  if(required==='Classroom')typeOK=['Classroom','Lecture Hall'].includes(room[2]);
  else if(required==='Laboratory')typeOK=['Laboratory','Computer Lab'].includes(room[2]);
  else if(required==='Practical Lab')typeOK=['Practical Lab','Workshop / Practical Lab'].includes(room[2]);
  else typeOK=room[2]===required;
  if(course[6]==='Practical'&&!['Computer Lab','Laboratory','Practical Lab','Workshop / Practical Lab'].includes(room[2]))typeOK=false;
  const needed=Array.isArray(course[9])?course[9]:typeof course[9]==='string'?course[9].split(',').map(x=>x.trim()).filter(Boolean):[];
  const have=Array.isArray(room[4])?room[4]:String(room[4]||'').split(',').map(x=>x.trim());
  return typeOK&&needed.every(x=>have.includes(x));
}
function roomFitsCourse(room,course,group){
  return Boolean(room&&group&&Number(room[3])>=Number(group[3])&&roomTypeFitsCourse(room,course));
}
function intervalsOverlap(aStart,aEnd,bStart,bEnd){return aStart<bEnd&&bStart<aEnd}
function isFacultyBlocked(facultyId,day,start,end){
  return (db.facultyUnavailable||[]).some(x=>normId(x[0])===normId(facultyId)&&x[1]===day&&intervalsOverlap(start,end,x[2],x[3]));
}
function allocationConflict(candidate,assigned){
  for(const e of assigned){
    if(e[6]!==candidate.day||!intervalsOverlap(candidate.start,candidate.end,e[7],e[8]))continue;
    if(normId(e[3])===normId(candidate.faculty))return 'faculty';
    if(normId(e[4])===normId(candidate.group))return 'group';
    if(normId(e[5])===normId(candidate.room))return 'room';
  }
  return '';
}
function makeCandidateEntry(task,candidate,allocationId){
  const c=task.course;
  const color=c[6]==='Practical'?'teal':({CSE:'blue',ECE:'orange',ME:'green',CE:'violet'}[c[2]]||'blue');
  return [allocationId,c[1],c[0],c[4],c[3],candidate.room,candidate.day,candidate.start,candidate.end,c[6],color];
}
function candidatePreference(task,candidate,assigned,random,previousEntries){
  const c=task.course;
  const groupDay=assigned.filter(e=>e[4]===c[3]&&e[6]===candidate.day).length;
  const facultyDay=assigned.filter(e=>e[3]===c[4]&&e[6]===candidate.day).length;
  const sameCourseDay=assigned.filter(e=>e[2]===c[0]&&e[6]===candidate.day).length;
  const room=db.rooms.find(r=>r[0]===candidate.room),group=db.groups.find(g=>g[0]===c[3]);
  const roomSlack=room&&group?Number(room[3])-Number(group[3]):0;
  const groupAdjacent=assigned.some(e=>e[4]===c[3]&&e[6]===candidate.day&&(e[8]===candidate.start||candidate.end===e[7]));
  const previousSlot=(previousEntries||[]).some(e=>e[2]===c[0]&&e[4]===c[3]&&e[6]===candidate.day&&e[7]===candidate.start&&e[8]===candidate.end);
  const previousExactRoom=previousSlot&&(previousEntries||[]).some(e=>e[2]===c[0]&&e[4]===c[3]&&e[6]===candidate.day&&e[7]===candidate.start&&e[8]===candidate.end&&e[5]===candidate.room);
  // Strongly prefer a different day/time from the previous generated/published schedule,
  // while preserving the normal course-spacing and workload-balancing preferences.
  const previousLayoutPenalty=(previousSlot?8:0)+(previousExactRoom?2:0);
  // Small seeded jitter breaks otherwise deterministic ties between equally valid slots.
  const shuffleJitter=(typeof random==='function'?random():Math.random())*1.5;
  return sameCourseDay*18+groupDay*3+facultyDay*2+candidate.startIndex*.25+candidate.dayIndex*.05+roomSlack*.015-(groupAdjacent?2:0)+previousLayoutPenalty+shuffleJitter;
}
function makeSchedulerRandom(seed){
  let state=(seed>>>0)||1;
  return function(){
    state=(state+0x6D2B79F5)>>>0;
    let t=state;
    t=Math.imul(t^(t>>>15),t|1);
    t^=t+Math.imul(t^(t>>>7),t|61);
    return ((t^(t>>>14))>>>0)/4294967296;
  };
}
function schedulerScheduleSignature(entries){
  return (entries||[]).map(e=>[e[2],e[4],e[6],e[7],e[8],e[5]].join('~')).sort().join('||');
}
function latestSchedulerReferenceEntries(){
  const runs=Array.isArray(db.schedulerRuns)?db.schedulerRuns:[];
  for(let i=runs.length-1;i>=0;i--)if(Array.isArray(runs[i]?.entries)&&runs[i].entries.length)return cloneData(runs[i].entries);
  if(Array.isArray(db.entries)&&db.entries.length)return cloneData(db.entries);
  const otherPublished=(db.timetableWeeks||[]).filter(w=>w.weekStart!==activeWeekStart&&Array.isArray(w.publishedEntries)&&w.publishedEntries.length).slice().sort((a,b)=>String(b.weekStart).localeCompare(String(a.weekStart)));
  if(otherPublished.length)return cloneData(otherPublished[0].publishedEntries);
  return Array.isArray(db.publishedEntries)&&db.publishedEntries.length?cloneData(db.publishedEntries):[];
}
function countChangedSchedulePlacements(previousEntries,nextEntries){
  if(!Array.isArray(previousEntries)||!previousEntries.length)return {changed:0,total:0};
  const byCourse=entries=>{
    const map=new Map();
    for(const e of entries||[]){const key=`${e[2]}|${e[4]}`;if(!map.has(key))map.set(key,[]);map.get(key).push(`${e[6]}|${e[7]}|${e[8]}|${e[5]}`);}
    for(const values of map.values())values.sort();
    return map;
  };
  const oldMap=byCourse(previousEntries),newMap=byCourse(nextEntries),keys=new Set([...oldMap.keys(),...newMap.keys()]);
  let changed=0,total=0;
  for(const key of keys){const a=oldMap.get(key)||[],b=newMap.get(key)||[],n=Math.max(a.length,b.length);for(let i=0;i<n;i++){total++;if(a[i]!==b[i])changed++;}}
  return {changed,total};
}
function explainUnscheduled(task,assigned){
  const c=task.course,group=db.groups.find(g=>g[0]===c[3]);
  if(!group)return 'Student group is missing or inactive.';
  if(!db.faculty.some(f=>f[0]===c[4]))return 'Assigned faculty member is missing or inactive.';
  const eligibleRooms=db.rooms.filter(r=>roomFitsCourse(r,c,group));
  if(!eligibleRooms.length){
    const suitableRooms=db.rooms.filter(r=>roomTypeFitsCourse(r,c));
    if(!suitableRooms.length)return `No room matches the required ${c[7]||'Classroom'} type or facilities.`;
    const largest=suitableRooms.slice().sort((a,b)=>Number(b[3])-Number(a[3]))[0];
    return `${largest[1]} is suitable, but its capacity is ${largest[3]} while this group has ${group[3]} students. Increase practical-room capacity or split the group.`;
  }
  const blocks=durationBlocks(courseDuration(c));
  if(!blocks.length)return `No contiguous ${courseDuration(c)}-minute block fits the configured teaching periods.`;
  let counts={faculty:0,group:0,room:0,availability:0,free:0};
  for(const day of days)for(const block of blocks)for(const room of eligibleRooms){
    const candidate={day,start:block.start,end:block.end,room:room[0],faculty:c[4],group:c[3]};
    if(isFacultyBlocked(c[4],day,block.start,block.end)){counts.availability++;continue}
    const conflict=allocationConflict(candidate,assigned);
    if(conflict)counts[conflict]++;else counts.free++;
  }
  const top=Object.entries(counts).filter(([k,v])=>['faculty','group','room','availability'].includes(k)&&v>0).sort((a,b)=>b[1]-a[1])[0];
  if(counts.free===0&&top){
    if(top[0]==='availability')return 'Faculty availability blocks every otherwise eligible option.';
    if(top[0]==='faculty')return 'Faculty member is already assigned during every remaining eligible option.';
    if(top[0]==='group')return 'The student group already has classes during every remaining eligible option.';
    if(top[0]==='room')return 'Suitable classrooms are booked during every remaining eligible option.';
  }
  return counts.free>0?'A valid slot exists individually, but assigning it prevents the remaining weekly sessions from fitting together. Try changing another session or adjusting availability.':'No valid slot remained after applying all hard constraints.';
}
function runAutoScheduler(seed=Math.floor(Math.random()*0xFFFFFFFF)>>>0,previousEntries=[]){
  const random=makeSchedulerRandom(seed);
  const generationIdBase=Math.max(Date.now(),Number(db.nextEntryId)||0)+1;
  let generatedIdSequence=0;
  const definitions=db.courses.map(c=>{
    const group=db.groups.find(g=>g[0]===c[3]),faculty=db.faculty.find(f=>f[0]===c[4]);
    const rooms=group?db.rooms.filter(r=>roomFitsCourse(r,c,group)):[];
    const blocks=durationBlocks(courseDuration(c));
    const candidates=[];
    for(let dayIndex=0;dayIndex<days.length;dayIndex++)for(const block of blocks)for(const room of rooms){
      candidates.push({day:days[dayIndex],dayIndex,start:block.start,end:block.end,startIndex:block.startIndex,room:room[0],faculty:c[4],group:c[3]});
    }
    return {course:c,group,faculty,candidates};
  });
  const tasks=[];
  let serial=1,required=0;
  for(const def of definitions){
    const n=Math.max(0,Number(def.course[5])||0);required+=n;
    for(let session=1;session<=n;session++){
      tasks.push({course:def.course,group:def.group,faculty:def.faculty,candidates:def.candidates,session,serial:serial++});
    }
  }
  // Keep the most-constrained-first course ordering; random variation is applied to valid slot scoring.
  tasks.sort((a,b)=>a.candidates.length-b.candidates.length||courseDuration(b.course)-courseDuration(a.course)||String(a.course[0]).localeCompare(String(b.course[0]))||a.session-b.session);
  const impossibleTasks=tasks.filter(t=>!t.candidates.length);
  const tasksToPlace=tasks.filter(t=>t.candidates.length>0);
  const unavoidable=impossibleTasks.map(t=>({course:t.course[1],code:t.course[0],session:t.session,reason:explainUnscheduled(t,[])}));
  const assigned=[],skipped=[],best={entries:[],unscheduled:unavoidable.slice(),count:-1};
  let nodes=0,searchLimit=false,complete=false;
  const maxNodes=25000,lastRank=new Map();
  function saveBest(){
    if(assigned.length>best.count){
      best.count=assigned.length;
      best.entries=assigned.slice();
      best.unscheduled=unavoidable.concat(skipped.map(u=>({...u})));
    }
    if(best.count===tasksToPlace.length)complete=true;
  }
  function dfs(index){
    if(complete||searchLimit)return;
    if(++nodes>maxNodes){searchLimit=true;saveBest();return}
    if(index>=tasksToPlace.length){saveBest();return}
    if(assigned.length+(tasksToPlace.length-index)<best.count)return;
    const task=tasksToPlace[index],key=task.course[0],previousRank=lastRank.has(key)?lastRank.get(key):-1;
    const options=[];
    for(let rank=0;rank<task.candidates.length;rank++){
      const c=task.candidates[rank];
      if(rank<=previousRank)continue;
      if(isFacultyBlocked(task.course[4],c.day,c.start,c.end))continue;
      if(allocationConflict(c,assigned))continue;
      options.push({candidate:c,rank,score:candidatePreference(task,c,assigned,random,previousEntries)});
    }
    options.sort((a,b)=>a.score-b.score||a.rank-b.rank);
    for(const option of options){
      const oldRank=lastRank.get(key);
      lastRank.set(key,option.rank);
      assigned.push(makeCandidateEntry(task,option.candidate,generationIdBase+generatedIdSequence++));
      dfs(index+1);
      assigned.pop();
      if(oldRank===undefined)lastRank.delete(key);else lastRank.set(key,oldRank);
      if(complete||searchLimit)return;
    }
    skipped.push({course:task.course[1],code:task.course[0],session:task.session,reason:explainUnscheduled(task,assigned)});
    dfs(index+1);
    skipped.pop();
  }
  dfs(0);
  const finalEntries=best.entries.slice().sort((a,b)=>days.indexOf(a[6])-days.indexOf(b[6])||a[7].localeCompare(b[7])||a[5].localeCompare(b[5]));
  if(generatedIdSequence)db.nextEntryId=Math.max(Number(db.nextEntryId)||0,generationIdBase+generatedIdSequence-1);
  return {entries:finalEntries,unscheduled:best.unscheduled,required,scheduled:best.entries.length,nodes,searchLimit,allCandidatesPlaced:best.count===tasksToPlace.length,complete:best.count===tasksToPlace.length&&best.unscheduled.length===0,algorithm:'Randomized constraint-based backtracking with most-constrained-first ordering',seed};
}
function applyGenerated(){
  if(!generationResult)return;
  publishIssues=[];
  db.entries=generationResult.entries.slice();
  save();
  const count=db.entries.length,missed=generationResult.unscheduled.length;
  generationResult=null;
  render();
  notify(`Generated draft applied: ${count} sessions scheduled${missed?`, ${missed} remain unscheduled`:''}.`);
}
function discardGenerated(){generationResult=null;publishIssues=[];publicationConfirmWarnings=[];allowPartialPublishOnce=false;render();notify('Generated timetable preview discarded. Existing draft preserved.');}
function removeAvailability(index){if(!db.facultyUnavailable)return;db.facultyUnavailable.splice(index,1);save();render();notify('Faculty availability restriction removed.');}

function autoPreview(){
  if(!Array.isArray(db.schedulerRuns))db.schedulerRuns=[];
  const recentRuns=db.schedulerRuns.slice(-8);
  const recentSignatures=new Set(recentRuns.map(run=>run.signature||schedulerScheduleSignature(run.entries||[])).filter(Boolean));
  const previousEntries=latestSchedulerReferenceEntries();
  const previousSignature=schedulerScheduleSignature(previousEntries);
  if(previousSignature)recentSignatures.add(previousSignature);
  let result=null,bestScore=-Infinity,attempts=0;
  // Try several randomized orderings. Prefer a complete, non-repeated schedule;
  // retain the best feasible result if the current constraints are restrictive.
  while(attempts<8){
    const seed=((Math.floor(Math.random()*0xFFFFFFFF)>>>0)^Date.now()^(attempts*0x9E3779B9))>>>0;
    const candidate=runAutoScheduler(seed,previousEntries);
    const signature=schedulerScheduleSignature(candidate.entries);
    const isDistinct=!recentSignatures.has(signature);
    const diff=countChangedSchedulePlacements(previousEntries,candidate.entries);
    const score=(candidate.complete?1000000:0)+(candidate.scheduled*100)+(isDistinct?50:0)+(diff.changed*2)-(candidate.nodes/100000);
    attempts++;
    if(score>bestScore){bestScore=score;result=candidate;result.signature=signature;result.changedPlacements=diff.changed;result.comparedPlacements=diff.total;result.repeatedArrangement=!isDistinct;}
    if(candidate.allCandidatesPlaced&&isDistinct)break;
  }
  db.schedulerRunCounter=(Number(db.schedulerRunCounter)||0)+1;
  result.variationNumber=db.schedulerRunCounter;
  result.variationAttempts=attempts;
  result.weekStart=activeWeekStart;
  db.schedulerRuns.push({weekStart:activeWeekStart,seed:result.seed,signature:result.signature||schedulerScheduleSignature(result.entries),createdAt:new Date().toLocaleString('en-IN'),createdAtISO:new Date().toISOString(),scheduled:result.scheduled,required:result.required,entries:cloneData(result.entries)});
  if(db.schedulerRuns.length>20)db.schedulerRuns=db.schedulerRuns.slice(-20);
  generationResult=result;
  save();
  render();
  notify(`Fresh timetable variation generated: ${result.scheduled} of ${result.required} sessions placed${attempts>1?` after ${attempts} randomized attempts`:''}.`);
}
let refreshInProgress=false;
async function refreshWorkspaceData(){
  if(refreshInProgress)return;
  if(!loggedInId){notify('Please sign in before refreshing CampusFlow data.');return;}
  if(modal){notify('Finish or close the open form before refreshing, so your entries are not lost.');return;}
  if(generationResult){notify('Apply or discard the generated timetable preview before refreshing, so it is not lost.');return;}
  const button=document.getElementById('cfRefreshDataBtn');
  const previousPage=page;
  const previousWeek=activeWeekStart;
  const previousScroll=window.scrollY||0;
  refreshInProgress=true;
  if(button){button.disabled=true;button.classList.add('is-refreshing');button.title='Reload this browser’s saved demo data';}
  try{
    const localState=CampusFlowServices.storage.load(initial);
    adoptLocalState(localState);
    const canManage=role==='Administrator'||role==='Coordinator';
    let targetWeek=db.timetableWeeks.find(w=>w.weekStart===previousWeek);
    if(!targetWeek||(!canManage&&!weekIsPublished(targetWeek))){
      const fallbackWeek=canManage?(db.activeTimetableWeekStart||latestPublishedWeekStart()):latestPublishedWeekStart();
      targetWeek=db.timetableWeeks.find(w=>w.weekStart===fallbackWeek)||db.timetableWeeks.find(w=>canManage||weekIsPublished(w));
    }
    if(targetWeek){loadWeekIntoGlobals(targetWeek.weekStart);db.activeTimetableWeekStart=targetWeek.weekStart;}
    page=previousPage;
    render();
    window.scrollTo(0,previousScroll);
    notify('Data refreshed from this browser. You remain signed in.');
  }catch(error){
    console.error('CampusFlow local refresh failed:',error);
    notify(`Refresh failed: ${error?.message||String(error)}. Your current screen and login session were kept.`);
  }finally{
    refreshInProgress=false;
    const currentButton=document.getElementById('cfRefreshDataBtn');
    if(currentButton){currentButton.disabled=false;currentButton.classList.remove('is-refreshing');currentButton.title='Refresh saved data in this browser without signing out';}
  }
}

function repairLegacyApprovedReschedules(){
  const legacy=(db.facultyRequests||[]).filter(r=>r.type==='timetable_change'&&r.status==='Approved'&&!r.publishedVersionNo);
  if(!legacy.length)return;
  const beforePublished=cloneEntries(getPublishedTimetableEntries());
  let nextPublished=cloneEntries(beforePublished),nextDraft=cloneEntries(db.entries);
  const changes=[],repaired=[],processed=[];
  legacy.forEach(request=>{
    const oldIndex=findOriginalRequestClass(nextPublished,request);
    let oldEntry=null;
    if(oldIndex>=0)oldEntry=cloneEntries([nextPublished[oldIndex]])[0];
    else {
      const alreadyAtProposal=nextPublished.find(e=>requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,request.proposed));
      if(!alreadyAtProposal)return;
    }
    const source=oldEntry||nextPublished.find(e=>requestClassIdentityMatches(e,request)&&requestClassSlotMatches(e,request.proposed));
    if(!source)return;
    processed.push(request);
    const updated=cloneEntries([source])[0];
    updated[6]=request.proposed.day;updated[7]=request.proposed.start;updated[8]=request.proposed.end;updated[5]=request.proposed.room;
    const beforeString=JSON.stringify(nextPublished);
    nextPublished=applyRequestMoveToEntries(nextPublished,request,request.proposed,source);
    nextDraft=applyRequestMoveToEntries(nextDraft,request,request.proposed,source);
    if(oldEntry&&JSON.stringify(oldEntry)!==JSON.stringify(updated))changes.push({type:'Changed',oldEntry,newEntry:updated,title:updated[1],code:updated[2]});
    if(beforeString!==JSON.stringify(nextPublished))repaired.push(request);
  });
  const publishedChanged=JSON.stringify(beforePublished)!==JSON.stringify(nextPublished);
  const draftChanged=JSON.stringify(db.entries)!==JSON.stringify(nextDraft);
  if(!publishedChanged&&!draftChanged){
    processed.forEach(r=>{r.publishedVersionNo=currentPublishedVersion()?.versionNo??0;r.appliedAt=r.appliedAt||r.reviewedAt||new Date().toLocaleString('en-IN');});
    if(processed.length)save();
    return;
  }
  db.entries=nextDraft;
  if(publishedChanged){
    const timestamp=new Date().toLocaleString('en-IN'),previous=currentPublishedVersion();
    const version=createTimetableVersion('Published',nextPublished,{title:'Reconciled approved class changes',notes:'Existing approved timetable-change requests were reconciled by moving the original class allocation and removing duplicate copies.'});
    db.publishedEntries=cloneEntries(nextPublished);db.currentPublishedVersionId=version.id;
    versionCompareA=version.id;versionCompareB=previous?.id||'';
    if(changes.length)createEmailNotificationDrafts(beforePublished,nextPublished,version.versionNo,timestamp,changes);
    processed.forEach(r=>{r.publishedVersionNo=version.versionNo;r.publishedVersionId=version.id;r.appliedAt=new Date().toLocaleString('en-IN');});
    repaired.forEach(r=>{
      const text=`${r.courseName||r.courseCode} has been moved to ${r.proposed.day}, ${label(r.proposed.start)}–${label(r.proposed.end)}, ${r.proposed.room}. Published timetable v${version.versionNo} is now active.`;
      db.notices.unshift(['Approved class change published',text,timestamp,r.facultyId,false]);
      db.notices.unshift(['Approved class change published',text,timestamp,r.groupId,false]);
      r.publishedVersionNo=version.versionNo;r.publishedVersionId=version.id;r.appliedAt=timestamp;r.legacyDuplicateRepair=true;
      if(!r.coordinatorRemarks||r.coordinatorRemarks.includes('draft only'))r.coordinatorRemarks=`Reconciled and published as timetable v${version.versionNo}. The existing class allocation was moved and duplicate copies were removed.`;
    });
  }else{
    processed.forEach(r=>{r.publishedVersionNo=currentPublishedVersion()?.versionNo??0;r.appliedAt=r.appliedAt||r.reviewedAt||new Date().toLocaleString('en-IN');});
  }
  save();
}
